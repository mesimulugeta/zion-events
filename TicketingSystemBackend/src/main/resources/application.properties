# =========================
# SERVER CONFIG
# =========================
server.port=8083
jwt.secret=${JWT_SECRET}

# =========================
# MYSQL DATABASE CONFIG
# =========================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ticketing_system_clean?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================
# JPA / HIBERNATE
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# =========================
# FLYWAY (DISABLED)
# =========================
spring.flyway.enabled=false

# =========================
# TEST CONFIG
# =========================
spring.test.database.replace=none

# =========================
# CLOUDINARY
# =========================
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api_key=${CLOUDINARY_API_KEY}
cloudinary.api_secret=${CLOUDINARY_API_SECRET}

# =========================
# EMAIL (Gmail SMTP)
# =========================
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.required=true
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory

# =========================
# CHAPA PAYMENT
# =========================
chapa.secret_key=${CHAPA_SECRET_KEY}
chapa.base_url=https://api.chapa.co/v1
chapa.return_url=${CHAPA_RETURN_URL:http://localhost:5173/payment/verify}
chapa.webhook_hash=${CHAPA_WEBHOOK_HASH:}