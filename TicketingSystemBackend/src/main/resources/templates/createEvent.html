<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create Event</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #e6f7f9; font-family: 'Montserrat', sans-serif; }
        .admin-nav {
            background: #0097a7;
            padding: 0 40px;
            height: 70px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .admin-nav a { color: white; text-decoration: none; font-weight: 500; margin-left: 16px; }
        .admin-nav a:hover { text-decoration: underline; }
        .admin-nav .brand { font-size: 1.2rem; font-weight: 700; color: white; }
        .box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            max-width: 700px;
            margin: 40px auto;
            box-shadow: 0 2px 12px rgba(0,0,0,0.07);
        }
        .btn-teal { background: linear-gradient(135deg, #00acc1, #007c8a); color: white; border: none; border-radius: 20px; }
        .btn-teal:hover { color: white; opacity: .9; }
        .btn-back { background: rgba(255,255,255,0.2); border: 2px solid white; color: white; border-radius: 20px; padding: 5px 16px; }
        .btn-back:hover { background: rgba(255,255,255,0.3); color: white; }
        .venue-hint { font-size: 0.8rem; color: #888; margin-top: 4px; }
    </style>
</head>
<body>

<div class="admin-nav">
    <span class="brand">🎟 Admin Panel</span>
    <div class="d-flex align-items-center">
        <a th:href="@{/admin/events}">Manage Events</a>
        <a th:href="@{/admin/reservations}">All Reservations</a>
        <a th:href="@{/}" class="btn btn-back ms-3">← Back to Home</a>
    </div>
</div>

<div class="box">
    <h4 class="mb-4">Create Event</h4>
    <form action="/admin/events/new" method="post">

        <div class="mb-3">
            <label class="form-label">Venue</label>
            <select name="venueId" class="form-select" required>
                <option value="" disabled selected>— Select a venue —</option>
                <option th:each="venue : ${venues}"
                        th:value="${venue.id}"
                        th:text="${venue.name + ' · ' + venue.address}">
                </option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Event Title</label>
            <input type="text" name="title" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Start Date &amp; Time</label>
            <input type="datetime-local" name="startAt" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">End Date &amp; Time</label>
            <input type="datetime-local" name="endAt" class="form-control" required>
        </div>

        <div class="mb-4">
            <label class="form-label">Available Seats</label>
            <input type="number" name="availableSeats" class="form-control" min="1" required>
            <div class="venue-hint">This should match the actual capacity of the selected venue.</div>
        </div>

        <div class="d-flex justify-content-between">
            <a th:href="@{/admin/events}" class="btn btn-outline-secondary">← Back to Events</a>
            <button type="submit" class="btn btn-teal px-4">Create Event</button>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
