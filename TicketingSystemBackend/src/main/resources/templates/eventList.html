<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Search Results</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
    <h1>Search Results</h1>
    <div class="list-group">
        <div th:each="event : ${events}" class="mb-2">
            <a th:href="@{/events/{id}/seats(id=${event.id})}" 
               th:text="${event.title}" 
               class="list-group-item list-group-item-action"></a>
            <a th:href="@{/events/{id}/edit(id=${event.id})}" 
               class="btn btn-sm btn-secondary ms-2">Edit</a>
        </div>
    </div>
    <a href="/" class="btn btn-outline-primary mt-3">🏠 Home</a>
</body>
</html>
