<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Manage Events</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #e6f7f9; font-family: 'Montserrat', sans-serif; }
        .admin-nav {
            background: #0097a7;
            padding: 0 40px;
            height: 70px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .admin-nav a { color: white; text-decoration: none; font-weight: 500; margin-left: 16px; }
        .admin-nav a:hover { text-decoration: underline; }
        .admin-nav .brand { font-size: 1.2rem; font-weight: 700; color: white; }
        .page-wrapper { max-width: 1100px; margin: 36px auto; padding: 0 16px; }
        .table-card {
            background: white;
            border-radius: 12px;
            padding: 28px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.07);
        }
        .badge-active    { background: #d4edda; color: #155724; padding: 4px 10px; border-radius: 20px; font-size: .8rem; }
        .badge-cancelled { background: #f8d7da; color: #721c24; padding: 4px 10px; border-radius: 20px; font-size: .8rem; }
        .badge-closed    { background: #e2e3e5; color: #383d41; padding: 4px 10px; border-radius: 20px; font-size: .8rem; }
        .btn-teal { background: linear-gradient(135deg, #00acc1, #007c8a); color: white; border: none; border-radius: 20px; }
        .btn-teal:hover { color: white; opacity: .9; }
        .btn-back { background: rgba(255,255,255,0.2); border: 2px solid white; color: white; border-radius: 20px; padding: 5px 16px; }
        .btn-back:hover { background: rgba(255,255,255,0.3); color: white; }
    </style>
</head>
<body>

<div class="admin-nav">
    <span class="brand">🎟 Admin Panel</span>
    <div class="d-flex align-items-center">
        <a th:href="@{/admin/events/new}" class="btn btn-teal me-2">+ Create Event</a>
        <a th:href="@{/admin/reservations}">All Reservations</a>
        <!-- ✅ renamed -->
        <a th:href="@{/}" class="btn btn-back ms-3">← Back to Home</a>
    </div>
</div>

<div class="page-wrapper">

    <div th:if="${message}" class="alert alert-info alert-dismissible fade show" role="alert">
        <span th:text="${message}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="table-card">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="mb-0">All Events</h4>
        </div>

        <div th:if="${#lists.isEmpty(events)}" class="text-muted text-center py-4">
            No events found.
        </div>

        <table th:if="${!#lists.isEmpty(events)}" class="table table-hover align-middle">
            <thead class="table-light">
                <tr>
                    <th>#</th>
                    <th>Title</th>
                    <th>Start</th>
                    <th>End</th>
                    <th>Status</th>
                    <th>Available Seats</th>
                    <th class="text-end">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="event : ${events}">
                    <td th:text="${event.id}"></td>
                    <td th:text="${event.title}"></td>
                    <td th:text="${#temporals.format(event.startAt, 'MMM d, yyyy HH:mm')}"></td>
                    <td th:text="${#temporals.format(event.endAt,   'MMM d, yyyy HH:mm')}"></td>
                    <td>
                        <span th:class="${'badge-' + #strings.toLowerCase(event.status)}"
                              th:text="${event.status}"></span>
                    </td>
                    <td th:text="${event.availableSeats}"></td>
                    <td class="text-end">
                        <a th:href="@{/admin/events/{id}/edit(id=${event.id})}"
                           class="btn btn-sm btn-outline-secondary me-1">Edit</a>
                        <form th:action="@{/admin/events/{id}/cancel(id=${event.id})}"
                              method="post" class="d-inline"
                              onsubmit="return confirm('Cancel this event?')">
                            <button type="submit" class="btn btn-sm btn-outline-danger"
                                    th:disabled="${event.status == 'CANCELLED'}">
                                Cancel
                            </button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
