<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Event</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #e6f7f9; font-family: 'Montserrat', sans-serif; }
        .admin-nav {
            background: #0097a7;
            padding: 0 40px;
            height: 70px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .admin-nav a { color: white; text-decoration: none; font-weight: 500; margin-left: 16px; }
        .admin-nav a:hover { text-decoration: underline; }
        .admin-nav .brand { font-size: 1.2rem; font-weight: 700; color: white; }
        .edit-container {
            background-color: white;
            border-radius: 12px;
            padding: 30px;
            margin: 40px auto;
            max-width: 700px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.07);
        }
        .btn-teal { background: linear-gradient(135deg, #00acc1, #007c8a); color: white; border: none; border-radius: 20px; }
        .btn-teal:hover { color: white; opacity: .9; }
        .btn-back { background: rgba(255,255,255,0.2); border: 2px solid white; color: white; border-radius: 20px; padding: 5px 16px; }
        .btn-back:hover { background: rgba(255,255,255,0.3); color: white; }
    </style>
</head>
<body>

<div class="admin-nav">
    <span class="brand">🎟 Admin Panel</span>
    <div class="d-flex align-items-center">
        <a th:href="@{/admin/events}">Manage Events</a>
        <a th:href="@{/admin/reservations}">All Reservations</a>
        <a th:href="@{/}" class="btn btn-back ms-3">← Back to Home</a>
    </div>
</div>

<div class="edit-container">
    <h4 class="mb-4">Edit Event</h4>

    <form th:action="@{/admin/events/{id}/edit(id=${event.id})}" method="post">
        <div class="mb-3">
            <label class="form-label">Event Title</label>
            <input type="text" name="title" th:value="${event.title}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Start Date &amp; Time</label>
            <input type="datetime-local" name="startAt"
                   th:value="${#temporals.format(event.startAt, 'yyyy-MM-dd''T''HH:mm')}"
                   class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">End Date &amp; Time</label>
            <input type="datetime-local" name="endAt"
                   th:value="${#temporals.format(event.endAt, 'yyyy-MM-dd''T''HH:mm')}"
                   class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Status</label>
            <select name="status" class="form-select">
                <option value="ACTIVE"    th:selected="${event.status == 'ACTIVE'}">ACTIVE</option>
                <option value="CANCELLED" th:selected="${event.status == 'CANCELLED'}">CANCELLED</option>
                <option value="CLOSED"    th:selected="${event.status == 'CLOSED'}">CLOSED</option>
            </select>
        </div>
        <div class="mb-4">
            <label class="form-label">Available Seats</label>
            <input type="number" name="availableSeats"
                   th:value="${event.availableSeats}"
                   class="form-control" min="0" required>
        </div>
        <div class="d-flex justify-content-between">
            <a th:href="@{/admin/events}" class="btn btn-outline-secondary">← Back to Events</a>
            <button type="submit" class="btn btn-teal px-4">Save Changes</button>
        </div>
    </form>

    <hr class="my-4">

    <div class="d-flex align-items-center justify-content-between">
        <span class="text-muted small">Cancelling will mark the event as CANCELLED and disable new bookings.</span>
        <form th:action="@{/admin/events/{id}/cancel(id=${event.id})}" method="post"
              onsubmit="return confirm('Are you sure you want to cancel this event?')">
            <button type="submit" class="btn btn-danger"
                    th:disabled="${event.status == 'CANCELLED'}">
                Cancel Event
            </button>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
